<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>CSS Only Modal</title>
    <!-- Internal Stylesheet -->
    <style type="text/css">
      *{
        box-sizing: border-box;
      }
      body {
        
        margin: 0;
      }
      a.button{
        display: inline-block;
        padding: 10px 20px;
        background-color: #007BFF;
        color: white;
        text-decoration: none;
        border-radius: 5px;
        margin: 20px;
      }
      .info_modal{
        /*stretch the div tp cover the entire screen*/
        position: fixed;
        top:0;
        left:0;
        right:0;
        background-color: rgba(0,0,0,0.5);
        z-index: 99999;
        opacity:0;
        transition: opacity 0.3s ease;
        pointer-events: none;
      }
      .info_modal:target{
        opacity:1;
        pointer-events: auto;
        /* when the modal is targeted, make it visible and allow interactions */
      }
      .center {
        justify-content: center;
        align-items: center;
       
      }

      </style>
  </head>
  <body>
    <a href="#info" class="button">Open Modal 1</a>
    <!-- megin modal 1 -->
      <!-- Parent wrapper div which will hae the id that the anchor tag button targets -->
      <!-- end modal 1 -->
       <!-- this div will also be our transparent backround overlay-->
     <div id="info" class="info_modal">
        <div class="modal-content">
          <span class="close">&times;</span>
          <h2>Modal Title</h2>
          <p>This is the modal content.</p>
        </div>
      </div>
  </body>
</html>

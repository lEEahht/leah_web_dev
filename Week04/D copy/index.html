<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Positioning Basics</title>
    <link rel="stylesheet" href="./css/styles.css" />
  </head>
  <body>
    <header>
      <h1>maybe this could be where a fixed navigation could live</h1>
    </header>
    <div class="abs-no-parent-pos">
        <p>this is an absolutely positioned element without a positioned parent</p>
    </div>
    <div class="rel-parent-pos">
      <p>this is a relatively positioned element with a positioned parent</p>
    </div>
    <div class="abs-rel-parent-pos">
      <p>this is a absolutly positioned inside of a relative positionedparent div</p>
    </div>
  </body>
</html>

<!DOCTYPE html>
<html>
    <head>
        <!--this is the characterset attribute this 
        defines the character encodind for the html doc
        UTF-8 is the most common character encoding.
        if you forget this your custom fonts (ie google fonts)
        that you use in you css wont display properly. 
        
        -->
        <meta charset="UTF-8" />
        <!-- 
        this is the viewport meta tag
        it sets the initial scal and ensures proper responive behavior 
        this tag overrides the browser default settings 
        -->
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <!--this title tag shows up as the bug blue test in a search engine results 
        its also is the test net to you favicon in the browser tag
        -->
        <title>HTML Boilerplate</title>


    </head>
    <body>
        <h1>
            One h1 per page. most important test on teh page. usually tagline, page title, article tite.
        </h1>
        <p>
            remeber to never have plaiin test in ur html doc that is not marked up with a tag
        </p>

    </body>
</html>
